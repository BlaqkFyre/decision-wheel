<style>
:root{--bg:#fff;--surface:#fff;--soft:#F1F3F5;--line:#E4E7EB;--ink:#1F2933;--muted:#52606D;--grey:#9AA3AD;--teal:#0E7C86;--tealbg:#0E7C86;--tealsoft:#E3F1F2;--tealline:#CFE3E5;--tealdark:#0E5F66;
  --amberbg:#FFF4D6;--amberfg:#7A5A00;--amberline:#E9C46A;--greenbg:#E7F6EC;--greenfg:#1E6B3A;--orangebg:#FBE3D7;--toastbg:#1F2933;color-scheme:light}
/* charcoal dark mode */
html[data-theme=dark]{--bg:#2A2C30;--surface:#33363B;--soft:#3A3D43;--line:#4A4E56;--ink:#ECEDEF;--muted:#BCC3CA;--grey:#8E969F;--teal:#5CC8D1;--tealbg:#0F7F89;--tealsoft:#21474B;--tealline:#2F6267;--tealdark:#A6E3E8;
  --amberbg:#4A3E1E;--amberfg:#F3D27A;--amberline:#8A7230;--greenbg:#1F3B2A;--greenfg:#9EDDB2;--orangebg:#5A3A2C;--toastbg:#111214;color-scheme:dark}
html,body{background:var(--bg)}
html[data-theme=dark] #s svg,html[data-theme=dark] .cmp svg{filter:invert(.86) hue-rotate(180deg) saturate(1.15)}
html[data-theme=dark] .dot{filter:none}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:var(--surface);color:var(--ink);border-color:var(--line)}
html[data-theme=dark] a{color:var(--teal)}
/* colours written straight into the page by the app */
html[data-theme=dark] [style*="color:#9AA3AD"],html[data-theme=dark] [style*="color:#52606D"]{color:var(--muted)!important}
html[data-theme=dark] [style*="color:#1F2933"]{color:var(--ink)!important}

html[data-theme=dark] [style*="background:#fff"]{background:var(--surface)!important}
html[data-theme=dark] [style*="background:#F4F5F7"]{background:var(--soft)!important}
html[data-theme=dark] [style*="background:#E3F1F2"]{background:var(--tealsoft)!important}
html[data-theme=dark] [style*="background:#E4E7EB"],html[data-theme=dark] [style*="background:#EEF2F4"],html[data-theme=dark] [style*="background:#F1F3F5"]{background:var(--line)!important}

#theme{padding:9px 12px;min-width:44px}

body{margin:0;background:var(--bg);font-family:Helvetica,Arial,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 16px 4px}

.hint{font-size:13px;color:var(--muted);margin:2px 16px 0;text-align:center}
#s{width:100%;max-width:1150px}#s svg{width:100%;height:auto;display:block}
.topic{cursor:pointer}
#tip{position:fixed;pointer-events:none;max-width:320px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(31,41,51,.15);padding:12px 14px;font-size:13px;line-height:1.4;display:none;z-index:10}

#tip .o:before{content:"";position:absolute;left:0;top:4px;width:8px;height:8px;border-radius:50%;border:2px solid var(--grey);box-sizing:border-box}

#tip .o.dec:before{background:var(--tealbg);border-color:var(--teal)}
#tip .o b{color:var(--ink)}
#tip .o.dec b,#tip .o.also b{color:var(--teal)}
#tip .o.also:before{border-color:var(--teal)}
.cmp{width:100%;max-width:1060px;padding:8px 16px 32px;box-sizing:border-box}
.cmp h2{font-size:22px;margin:10px 0 2px}
.cmp .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.people{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;background:var(--bg)}

.dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 11px Helvetica,Arial;flex:none;box-shadow:0 0 0 2px var(--bg)}
.grid{display:grid;grid-template-columns:minmax(130px,1.1fr) repeat(3,minmax(0,1fr)) 92px;border-top:1px solid var(--line)}
.grid>div{border-bottom:1px solid var(--line);padding:8px 8px;min-height:44px;box-sizing:border-box}
.gh{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;align-self:end;border-bottom:1px solid var(--grey)!important}
.tn{font-weight:700;font-size:14px;display:flex;align-items:center}

.pair{margin-top:26px}

.blank{display:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px}

.tag{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 9px;margin:2px 3px 2px 0;font-size:12.5px}
.src{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}

.selref{font:14px Helvetica,Arial;padding:4px 6px;margin-left:6px}
.pbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
button.mini{padding:5px 11px;font-size:13px}
.fams{display:flex;flex-wrap:wrap;gap:10px 22px;margin-bottom:16px}
.fh{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 5px;display:flex;align-items:center;gap:6px}
.fh i{width:10px;height:10px;border-radius:50%;display:inline-block}
.fam .people{margin:0;gap:6px}
button.chip{font:600 13.5px Helvetica,Arial;color:var(--ink);padding:3px 10px 3px 3px;border:1.5px solid var(--line)}
button.chip.off{opacity:.38}
.hm th.ch{text-align:center;font-size:12px;white-space:normal;min-width:62px}
.hm{table-layout:fixed}.hm td{min-width:0;font-size:11.5px;padding:7px 3px;overflow-wrap:anywhere;hyphens:auto}.hm th.ch{min-width:0;font-size:11.5px}.hm tr>th:first-child{width:140px}
.vm{font-size:9px;margin-left:2px;letter-spacing:-1px;opacity:.85}
.hmt{table-layout:auto;min-width:1480px}.hmt td{min-width:66px}.hmt th:first-child{width:170px;font-size:12.5px}.hmt td{font-size:11.5px;overflow-wrap:normal;hyphens:none}
.new{font:600 9.5px Helvetica,Arial;background:var(--amberbg);color:var(--amberfg);border-radius:4px;padding:1px 4px;margin-left:2px;text-transform:uppercase}
.chin{font:13.5px Helvetica,Arial;border:1px solid var(--line);border-radius:4px;padding:4px 6px;width:150px}

.tbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:0 0 12px;font-size:14px}
.qb{display:flex;gap:6px;flex-wrap:wrap}
button.lnk{border:0;background:none;color:var(--teal);font:600 11px Helvetica,Arial;padding:0 2px;margin-left:4px;cursor:pointer;text-decoration:underline;text-transform:none;letter-spacing:0}
button.chip.tgt{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.new.usr{background:var(--tealsoft);color:var(--tealdark)}
.ch3{font-size:16px;margin:18px 0 6px}
.clist{list-style:none;padding:0;margin:0}.clist li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cdet{font-size:12.5px;color:var(--muted);margin-top:3px}
.cbar{display:inline-block;width:90px;height:7px;background:var(--soft);border-radius:4px;margin-left:10px;vertical-align:middle;overflow:hidden}.cbar i{display:block;height:100%;background:var(--tealbg)}
.rl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rcard{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.rt{font-weight:700;font-size:15px;margin-bottom:4px}.rov{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.ro{font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}.ro div{color:var(--muted);margin-top:2px}
.rtag{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:4px}.rtag.dec{background:var(--tealbg);color:#fff}.rtag.also{background:var(--bg);color:var(--teal);border:1.5px solid var(--teal)}.rtag.con{background:var(--soft);color:var(--muted)}.rcard.flash{box-shadow:0 0 0 3px var(--teal)}.rcard{transition:box-shadow .3s}
.blinks{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:4px;vertical-align:middle}
.blink{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;text-decoration:none;white-space:nowrap}
.blink.au{background:var(--tealsoft);color:var(--tealdark)}.blink.us{background:var(--soft);color:var(--muted)}.blink.free{background:var(--greenbg);color:var(--greenfg)}
.bk{margin:3px 0}
.kbadge{font-size:10px;font-weight:700;background:var(--amberbg);color:var(--amberfg);border-radius:4px;padding:1px 5px;margin-left:4px}.rtag.dif{background:var(--orangebg);color:var(--ink)}
.sv .svtop{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:14px}
.svrow{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-size:14px;align-items:center}
.svq{border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:10px 14px}
.svq legend{font-weight:700;font-size:15px;padding:0 4px}.svq legend span{font-weight:400;color:var(--muted);font-style:italic;font-size:13px;margin-left:6px}
.svopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.svo{display:block;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:13px;cursor:pointer}
.svo:has(input:checked){border-color:var(--teal);background:var(--tealsoft)}
.svo b{margin-left:4px}.svo span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.svo.ns{display:flex;align-items:center}
.svmeta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:8px;font-size:12.5px;color:var(--muted)}.svmeta label{margin-right:6px}
.fbtn{display:inline-block;padding:5px 11px;font-size:13px;border:1px solid var(--teal);border-radius:6px;color:var(--teal);cursor:pointer}
.err{color:#B42318;font-size:13px}
.savestat{font-size:12.5px;color:var(--muted);text-align:center;margin:2px 16px 0}.savestat .lnk{font-size:12.5px}
button.mini.primary{background:var(--tealbg);color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--toastbg);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
select.selref{font:14px Helvetica,Arial;padding:4px 6px}

/* survey: admin tools, panels */
.svtools{display:flex;flex-wrap:wrap;gap:10px 22px;margin:4px 0 14px;padding:10px 12px;background:var(--soft);border-radius:8px}
.svtools>div{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.svlbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:2px}
.svpanel{border:1px solid var(--tealline);background:var(--tealsoft);border-radius:8px;padding:12px 14px;margin:0 0 14px}
.svpanel.warn{border-color:var(--amberline);background:var(--amberbg)}
.svpanel textarea{width:100%;height:80px;font:12px monospace;box-sizing:border-box;margin-top:6px}
.svpanel .sub{margin:4px 0 8px}
a.btnlink{display:inline-block;padding:5px 11px;font-size:13px;border:1px solid var(--teal);border-radius:6px;color:var(--teal);text-decoration:none}
a.btnlink.primary{background:var(--tealbg);color:#fff}
.adm{background:var(--tealbg);color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;margin-right:4px}
.err{color:#B8483A;font-size:13px}
/* bios: cards on wide screens, tap-to-open pills on phones */
.bio-mob{display:none}
.bpill{border:1px solid var(--line);border-radius:22px;margin:0 0 8px;background:var(--bg);overflow:hidden}
.bpill summary{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;cursor:pointer;list-style:none}
.bpill summary::-webkit-details-marker{display:none}
.bav{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.bpm{flex:1;min-width:0;display:flex;flex-direction:column}
.bpn{font-weight:700;font-size:15px}
.bps{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bchev{color:var(--grey);font-size:20px;transition:transform .2s}
.bpill[open]{border-radius:18px}.bpill[open] .bchev{transform:rotate(90deg)}
.bbody{padding:0 14px 14px}
.ro.bspec{border-left:3px solid var(--teal);padding-left:8px}.ro.bcrit{border-left:3px solid #B7791F;padding-left:8px}.ro.bcon{border-left:3px solid #B8483A;padding-left:8px}
.bbtns{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:700px){
  .bio-desk{display:none}.bio-mob{display:block}
  .bbtns .lnk{flex:1;border:1px solid var(--teal);border-radius:999px;padding:8px;text-align:center}
  .cmp{padding:8px 12px 28px}
  .svtools{gap:10px}.svtools>div{width:100%}
  .sv .chin{width:100%!important;box-sizing:border-box}
  .sv .svrow label{display:block;width:100%;margin-bottom:6px}
  .tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{flex:none}
  button{padding:8px 12px;font-size:14px}
}

/* topic pages */
.tnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--tealbg);color:#fff;font-size:12px;margin-right:8px;vertical-align:middle}
.tnumbig{background:var(--tealbg);color:#fff}
.topt{border-top:1px dashed var(--line);padding:9px 0 6px}
.toh{font-size:14px}.tod{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.trow{display:grid;grid-template-columns:150px 1fr;gap:8px;font-size:12.5px;padding:3px 0;align-items:start}
.trow>div{color:var(--ink)}
.tl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding-top:2px}
.vfor .tl{color:var(--teal)}.vag .tl{color:#C0703C}
.vlist{display:flex;flex-wrap:wrap;gap:4px}
a.vref{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;text-decoration:none;color:var(--ink);background:var(--soft)}
.vfor a.vref{border-color:var(--tealline);background:var(--tealsoft)}.vag a.vref{border-color:#E9B8A0;background:var(--orangebg)}
.tdots{display:flex;flex-wrap:wrap;gap:3px}button.tdot{border:0;background:none;padding:0;cursor:pointer}
.tmut{color:var(--grey)}
.rl.tdesk{grid-template-columns:repeat(auto-fill,minmax(460px,1fr))}
@media (max-width:700px){.tdesk{display:none}.trow{grid-template-columns:1fr;gap:2px}}
html[data-theme=dark] a.vref{color:var(--ink)}html[data-theme=dark] .vag a.vref{border-color:#8A5A45}html[data-theme=dark] .vag .tl{color:#E8A27A}

/* era filter */
.erabar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:-4px 0 12px}
button.era{border-radius:999px;opacity:.55}button.era.on{opacity:1}
.ecount{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:rgba(255,255,255,.25);font-size:11px;margin-left:2px}
button.era:not(.on) .ecount{background:var(--soft)}
.etag{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:3px;vertical-align:1px}
.etag.eA{background:#EFE6D8;color:#6B4E1F}.etag.eH{background:#E3E8F4;color:#2F4A7A}.etag.eM{background:var(--tealsoft);color:var(--tealdark)}

/* inferred placements */
.inf{font-style:italic}.tag.inf,.rtag.inf{border:1px dashed var(--grey)}td.inf{font-style:italic}
.tdot.inf .dot{outline:2px dashed var(--grey);outline-offset:1px}
.infkey{font-weight:400;font-style:italic;font-size:11.5px;color:var(--muted);margin-left:6px}
/* commonly held by */
.chb{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:5px 0;align-items:start}
.chbo{font-size:12px;font-weight:700;color:var(--ink);padding-top:3px}
.tag.org{background:var(--soft);border:1px solid var(--line)}
@media (max-width:700px){.chb{grid-template-columns:1fr;gap:2px}}

/* each position on a topic page: gold-bordered panel */
.topt{border:2px solid #C9A227;border-radius:14px;padding:10px 12px 8px;margin:10px 0;background:var(--bg)}
html[data-theme=dark] .topt{border-color:#B8962E}
.topt+.topt{border-top:2px solid #C9A227}

/* compare: people list in a collapsible box */
.pbox{border:1px solid var(--line);border-radius:12px;margin:0 0 16px;background:var(--bg)}
.pbox summary{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;list-style:none;flex-wrap:wrap}
.pbox summary::-webkit-details-marker{display:none}
.pbt{font-weight:700;font-size:14px}.pbn{font-size:12.5px;color:var(--muted)}
.pbd{display:inline-flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.pbox[open] .bchev{transform:rotate(90deg)}
.pbox .fams{padding:4px 12px 10px;margin:0;border-top:1px dashed var(--line)}

/* gold border for every collapsible pill (bios, topics, reading list) */
.bpill{border:2px solid #C9A227}html[data-theme=dark] .bpill{border-color:#B8962E}
.tab-read .rcard,.bio-desk .rcard{border:2px solid #C9A227}html[data-theme=dark] .tab-read .rcard,html[data-theme=dark] .bio-desk .rcard{border-color:#B8962E}
/* verse tools */
a.vall{font-size:11.5px;font-weight:700;color:var(--teal);text-decoration:none;border:1px dashed var(--teal);border-radius:999px;padding:1px 8px;white-space:nowrap}
#vpop{position:fixed;z-index:40;display:none;background:var(--bg);color:var(--ink);border:2px solid #C9A227;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:10px 12px;font-size:13.5px;line-height:1.5;max-height:50vh;overflow:auto}
#vpop .vph{display:flex;align-items:center;gap:6px;margin-bottom:4px}#vpop .vpx{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;padding:0 4px;color:var(--muted)}
#vpop sup{font-size:10px;color:var(--muted);margin-right:2px}
#vpop .vpf{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
#vpop .vpo{font-weight:700;color:var(--teal);text-decoration:none}#vpop .vpc{font-size:10.5px;color:var(--muted)}

/* compare landing: equal-size wrapped buttons */
.btngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 14px}
.btngrid button{width:100%;min-height:40px;border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.2;white-space:normal;text-align:center}
.cmp .tabs.btngrid{display:grid;flex-wrap:initial;overflow:visible}
.btngrid button small{font-size:11px;opacity:.85}
button.era{opacity:1}button.era:not(.on){background:var(--bg);color:var(--teal)}
.ctl{border:1px solid var(--line);border-radius:14px;padding:12px 14px 2px;margin:0 0 14px;background:var(--soft)}
.ctlrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ctlrow .selref{flex:1;min-width:180px;max-width:340px;margin:0;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ctlh{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px}
.ctlnote{font-weight:400;text-transform:none;letter-spacing:0;font-size:11.5px;margin-left:6px}
@media (max-width:700px){.btngrid{grid-template-columns:repeat(3,1fr);gap:6px}.btngrid button{font-size:12.5px;padding:6px 4px;min-height:44px}.cmp .tabs.btngrid{display:grid;flex-wrap:initial;overflow:visible}.ctlrow .selref{max-width:none}}
/* pills: grey outline when closed, teal when open; topic positions keep their gold */
.bpill{border:1.5px solid var(--muted)!important}
.bpill[open]{border:2px solid var(--teal)!important}
.tab-read .rcard,.bio-desk .rcard,.tdesk .rcard{border:1.5px solid var(--muted)!important}

am's promises incl. the land; ethnic Israel to be saved at Christ's return.", "s": [["Piper, Israel, Palestine, and the Middle East (sermon)", "https://www.desiringgod.org/messages/israel-palestine-and-the-middle-east"], ["Piper, Who Is the True Israel? (sermon)", "https://www.desiringgod.org/messages/who-is-the-true-israel"]]}, "5": {"c": 0, "n": "The man of lawlessness is an end-of-age figure 'destroyed by the final fiery second coming'; past figures were forerunners.", "s": [["Ask Pastor John: Who Is the Man of Lawlessness?", "https://www.desiringgod.org/interviews/who-is-the-man-of-lawlessness"]]}, "6": {"c": 0, "n": "Affirms 'the endless suffering of the wicked'; annihilation 'reduces sin from high treason to a misdemeanor.'", "s": [["Piper, The Echo and Insufficiency of Hell (sermon)", "https://www.desiringgod.org/messages/the-echo-and-insufficiency-of-hell-part-1"]]}, "7": {"c": 0, "n": "Rejects soul sleep: death is 'gain' because Paul 'will be in the presence of Christ.'", "s": [["Ask Pastor John: Does My Soul Sleep After Death?", "https://www.desiringgod.org/interviews/does-my-soul-sleep-after-death"]]}, "8": {"c": 0, "n": "Creation 'will be set free from its bondage to corruption'; what we rightly love will be 'perfected and preserved.'", "s": [["Ask Pastor John: Will the New Creation Look Like This One?", "https://www.desiringgod.org/interviews/will-the-new-creation-look-like-this-one"]]}, "9": {"c": 0, "n": "'God's election is an unconditional act of free grace... given through his Son Jesus before the world began.'", "s": [["Piper, What We Believe About the Five Points of Calvinism", "https://www.desiringgod.org/articles/what-we-believe-about-the-five-points-of-calvinism"], ["Wikipedia: John Piper (theologian)", "https://en.wikipedia.org/wiki/John_Piper_(theologian)"]]}, "10": {"c": 0, "n": "Advocates obeying 'earnestly desire the spiritual gifts, especially that you might prophesy'; has prayed for tongues.", "s": [["Christian Post: Piper on Strange Fire, prophecy and tongues", "https://assets.christianpost.com/news/john-piper-talks-john-macarthurs-strange-fire-conference-pursuing-gifts-of-prophecy-and-speaking-in-tongues-109022/"], ["Ask Pastor John: Do Cessationists Miss Out on the Full Joys?", "https://www.desiringgod.org/interviews/do-cessationists-miss-out-on-the-full-joys-of-christianity"]]}, "11": {"c": 0, "n": "Baptist: church membership awaits 'credible profession of faith... publicly signified by baptism'; infants not baptized.", "s": [["Ask Pastor John: How Do My Unbaptized Children Relate to the New-Covenant Promises?", "https://www.desiringgod.org/interviews/how-do-my-unbaptized-children-relate-to-the-new-covenant-promises"], ["Wikipedia: John Piper (theologian) - Reformed Baptist", "https://en.wikipedia.org/wiki/John_Piper_(theologian)"]]}, "13": {"c": 1, "n": "'All who are justified will win the fight of faith. They will persevere in faith and will not surrender finally.'", "s": [["Piper, What We Believe About the Five Points of Calvinism", "https://www.desiringgod.org/articles/what-we-believe-about-the-five-points-of-calvinism"]]}, "15": {"c": 0, "n": "Co-editor of Recovering Biblical Manhood and Womanhood; complementarian.", "s": [["Wikipedia: John Piper (theologian)", "https://en.wikipedia.org/wiki/John_Piper_(theologian)"]]}, "16": {"c": 1, "n": "Rejects physical presence but beyond memorial: 'eat spiritually... by faith', feasting on the risen, living Christ.", "s": [["Piper, Why We Eat the Lord's Supper, Part 1 (sermon)", "https://www.desiringgod.org/messages/why-we-eat-the-lords-supper-part-1"]]}}, "Jack Hayford": {"0": {"c": 0, "n": "Teaches a future millennial age after the tribulation (saints reign with Christ), while weighing strengths of all three views.", "s": [["Hayford, The Millennium Dilemma (message series)", "https://www.jackhayford.org/message_series/the-millennium-dilemma/"], ["Hayford, Beginning to Reign (1976)", "https://www.jackhayford.org/teaching/beginning-to-reign/"]]}, "6": {"c": 0, "n": "(inferred) Foursquare Declaration (church he led): the wicked 'adjudged to everlasting punishment'; hell as lake of fire.", "s": [["Foursquare Church Declaration of Faith, arts. XVIII, XX", "https://resources.foursquare.org/wp-content/uploads/sites/2/2024/08/Statement-of-Faith-ENG.pdf"]]}, "9": {"c": 1, "n": "(inferred) Criticised Reformed theology as 'a monster of theology that dampens... our passion and partnership with God'; Pentecostal Arminian tradition.", "s": [["Christianity Today profile (July 2005)", "https://christianitytoday.com/ct/2005/july/18.24.html"]]}, "10": {"c": 0, "n": "'Tongues are God's Idea!'; passion 'to move every Christian to the free exercise of tongues.'", "s": [["Hayford, The Beauty of Spiritual Language", "https://jackhayford.org/?p=1916"], ["Christianity Today profile (July 2005)", "https://christianitytoday.com/ct/2005/july/18.24.html"]]}, "11": {"c": 0, "n": "(inferred) Foursquare Declaration: water baptism is 'a blessed outward sign of an inward work' following repentance and faith.", "s": [["Foursquare Church Declaration of Faith, art. IX", "https://resources.foursquare.org/wp-content/uploads/sites/2/2024/08/Statement-of-Faith-ENG.pdf"]]}, "15": {"c": 2, "n": "'The Foursquare Church is wide open to women in leadership'; his wife Anna was an ordained Foursquare minister.", "s": [["Foursquare report, Connection '09 convention", "https://resources.foursquare.org/?p=5066"], ["PAOC: In memoriam Anna Hayford, Foursquare minister", "https://paoc.org/missions/global-view/2017/03/08/in-memoriam---anna-hayford-foursquare-minister"]]}, "16": {"c": 1, "n": "Bread doesn't become flesh, 'yet neither are we saying these are just a piece of bread'; Spirit's power nourishes partakers.", "s": [["Hayford, Come to the Table", "https://www.jackhayford.org/come-to-the-table/"]]}}, "N.T. Wright": {"1": {"c": 2, "n": "\"Farewell to the Rapture\": Jesus 'never predicted such an event'; 1 Thess 4 is the one public return, living transformed, not a secret rapture.", "s": [["Wright, 'Farewell to the Rapture', Bible Review 17:4 (2001)", "https://library.biblicalarchaeology.org/endnote/endnote-2-farewell-to-the-rapture/"], ["Tim White, 'N. T. Wright's Denial of the Rapture'", "https://drtimwhite.net/blog/2017/4/13/n-t-wrights-denial-of-the-rapture"]]}, "3": {"c": 2, "n": "Reads 'all Israel' (Rom 11:26) as the one family of Jews and Gentiles in Christ; no separate future national program.", "s": [["Perriman, 'Will all Israel be saved? Hurtado and Wright'", "https://www.postost.net/2012/04/will-all-israel-be-saved-hurtado-wright"], ["Vanlaningham, 'An Evaluation of N. T. Wright's View of Israel in Romans 11', BSac 170", "https://www.galaxie.com/article/bsac170-678-05"]]}, "6": {"c": null, "n": "Surprised by Hope: rejects universalism and classic torment imagery; the finally impenitent become 'ex-human', ceasing to bear God's image.", "s": [["Modern Reformation review of Surprised by Hope", "https://www.modernreformation.org/resources/articles/surprised-by-hope-rethinking-heaven-the-resurrection-and-the-mission-of-the-church-by-n-t-wright"], ["Jay Guin, 'Surprised by Hope: Hell, Part 1'", "https://oneinjesus.info/2008/07/surprised-by-hope-hell-part-1/"]]}, "7": {"c": 0, "n": "Dead are 'with Christ' and conscious: 'Had the post-mortem state been unconscious, would Paul have thought of it as far better?'", "s": [["Wright, 'Rethinking the Tradition' (ntwrightpage)", "https://ntwrightpage.com/2016/07/12/rethinking-the-tradition"], ["iMonk, 'NT Wright on the Intermediate State'", "https://imonk.blog/2013/09/23/nt-wright-on-the-intermediate-state/"]]}, "8": {"c": 0, "n": "Heaven is stage one; the goal is bodily resurrection in a renewed heaven and earth, the redemption of the whole cosmos.", "s": [["Wright, 'Rethinking the Tradition' (ntwrightpage)", "https://ntwrightpage.com/2016/07/12/rethinking-the-tradition"], ["Modern Reformation review of Surprised by Hope", "https://www.modernreformation.org/resources/articles/surprised-by-hope-rethinking-heaven-the-resurrection-and-the-mission-of-the-church-by-n-t-wright"]]}, "11": {"c": 1, "n": "\"God's people in Christ are all, including children, to be marked with the covenant sign\"; asks what justifies NOT baptizing children.", "s": [["Wright, WrightSaid Q&A, Nov 2004 (ntwrightpage)", "https://ntwrightpage.com/2016/04/25/wrightsaid-qa-november-2004/"]]}, "14": {"c": 2, "n": "Hominids arose in 'the long slow process of God's good creation'; God then called one pair. 'If creation is through Christ, evolution is what you'd expect.'", "s": [["Interview with N. T. Wright on Eden, the Flood, Babel (One In Jesus)", "https://oneinjesus.info/2014/06/apologetics-ruminations-on-eden-the-flood-babel-archaeology-an-interview-with-n-t-wright/"], ["Gentry, 'Would Christ Create Through Evolution?' (quoting Wright)", "https://postmillennialworldview.com/2017/07/14/would-christ-create-through-evolution/"]]}, "15": {"c": 2, "n": "\"We have seriously misread the relevant passages\"; supports women's ordination incl. as bishops, teaching and leading.", "s": [["Wright, 'Women's Service in the Church: The Biblical Basis' (Fulcrum)", "https://fulcrum-anglican.org.uk/?p=14014"], ["Wright, 'The Biblical Basis for Women's Service in the Church' (CBE)", "https://www.cbeinternational.org/?p=38728"]]}}, "John Stott": {"6": {"c": 1, "n": "Endless torment 'emotionally... intolerable'; tentatively holds annihilation is a legitimate biblical view (Essentials, 1988, p.314ff).", "s": [["Stott in Edwards & Stott, Essentials (1988), quoted at afterall.net", "https://afterall.net/quotes/john-stott-on-annihilationism/"], ["Anglican Ink, 'John Stott, Annihilationism and the Evangelical Controversy'", "https://anglican.ink/2026/07/09/john-stott-annihilationism-and-the-evangelical-controversy/"]]}, "11": {"c": 1, "n": "Defended infant baptism as Anglican evangelical; baptism signifies union with Christ, forgiveness, gift of the Spirit.", "s": [["Stott & Motyer, The Anglican Evangelical Doctrine of Infant Baptism (Latimer Trust)", "https://latimertrust.org/product-page/the-anglican-evangelical-doctrine-of-infant-baptism"], ["Latimer Trust, 'Infant Baptism' review of Stott", "https://www.latimertrust.org/post/infant-baptism"]]}, "12": {"c": 2, "n": "\"The most Christian stance is to remain agnostic on this question... however, I am imbued with hope.\"", "s": [["TGC, 'What About Those Who Haven't Heard?' (quoting Stott, Evangelical Essentials)", "https://www.thegospelcoalition.org/article/what-about-those-who-havent-heard/"]]}, "14": {"c": 2, "n": "Our bodies 'are related to the primates'; evolution may have produced the hominid into whom God breathed his image (Homo divinus), Adam historical.", "s": [["Scot McKnight on Stott's The Message of Romans (Jesus Creed)", "https://www.beliefnet.com/columnists/jesuscreed/?p=5145"], ["Banner of Truth review of Stott, Through the Bible Through the Year", "https://banneroftruth.org/us/?p=2601"]]}, "15": {"c": 1, "n": "Women may teach men and be ordained, but within a local team where 'a man should be the team leader' (masculine headship).", "s": [["Robert Brow review of Stott, 'Women, Men and God' (Our Social & Sexual Revolution, 1999)", "https://brow.on.ca/Articles/Stott1.htm"], ["Kevin DeYoung, 'Why Complemegalitarianism Doesn't Work' (discusses Stott)", "https://clearlyreformed.org/go-big-or-go-home-why-complemegalitarianism-doesnt-work-3/"]]}}, "R.C. Sproul": {"1": {"c": 2, "n": "\"When Jesus comes... with his whole church; the church will be caught up to meet him as he descends\" - one return, no pre-trib rapture.", "s": [["Gospel Herald, 'Theologian Offers Clarity to Rapture, Last Days Beliefs' (Sproul)", "https://www.gospelherald.com/news/theologian-offers-clarity-to-rapture-last-days-beliefs"]]}, "2": {"c": 1, "n": "Self-described partial preterist: most of Revelation fulfilled around AD 70, but not full preterism (future return and resurrection).", "s": [["Effectual Grace, 'R.C. Sproul: Three Questions on his Eschatology' (Sproul quotes)", "https://effectualgrace.com/2025/06/16/r-c-sproul-three-questions-on-his-eschatology/"], ["Mayhue, critique of Sproul's preterism, TMSJ 14", "https://tyndale.tms.edu/wp-content/uploads/2021/09/tmsj14a.pdf"]]}, "5": {"c": 1, "n": "The Last Days According to Jesus: matches the beast of Revelation with Nero, 'right down to the name' (666 gematria).", "s": [["Ligonier, The Last Days According to Jesus: 'The Beast'", "https://learn.ligonier.org/series/last-days-according-to-jesus/the-beast"], ["Tony Garland, 'The Last Days According to Sproul'", "https://www.spiritandtruth.org/teaching/topics_by_tony_garland_01/15_The_Last_Days_According_to_Sproul/20131119_last_days_according_to_sproul.html"]]}, "6": {"c": 0, "n": "Hell is 'ongoing, eternal punishment', 'a place of unspeakable pain and torment'; rejects annihilationism.", "s": [["Sproul, 'The Place of God's Disfavor' (Ligonier)", "https://www.ligonier.org/blog/place-gods-disfavor/"]]}, "7": {"c": 0, "n": "Rejects soul sleep: 'Even as disembodied souls, there will be a continued consciousness of our personal existence.'", "s": [["Ligonier Q&A, Sproul: 'Do Christians go immediately to heaven when they die?'", "https://learn.ligonier.org/qas/do-christians-go-immediately-to-heaven-when-they-die"]]}, "9": {"c": 0, "n": "Chosen by God defends Reformed predestination and sovereign election as grounded in God's love.", "s": [["Ligonier, Chosen by God collection", "https://learn.ligonier.org/collections/chosen-by-god"], ["Wikipedia, R. C. Sproul", "https://en.wikipedia.org/wiki/R._C._Sproul"]]}, "11": {"c": 1, "n": "\"I think it's a sin—you can quote me—not to baptize your children\"; covenant household sign never revoked.", "s": [["Heidelblog, 'R. C. Sproul On Infant Baptism, Sin, And Patience'", "https://heidelblog.net/2014/07/r-c-sproul-on-infant-baptism-sin-and-patience/"], ["Ligonier, Sproul, The Sacraments: 'The Case for Infant Baptism'", "https://learn.ligonier.org/series/sacraments/the-case-for-infant-baptism-part-1"]]}, "13": {"c": 1, "n": "\"The only reason we persevere... is because God preserves us.\"", "s": [["Ligonier, Ultimately with R.C. Sproul: 'Perseverance of the Saints'", "https://learn.ligonier.org/podcasts/ultimately-with-rc-sproul/perseverance-of-the-saints"]]}, "14": {"c": 0, "n": "Later affirmed creation in 'six twenty-four-hour periods' (Truths We Confess), after earlier openness to framework view.", "s": [["Rachel Miller, 'What Is R.C. Sproul's Position on Creation?' (quoting Truths We Confess)", "https://rachelgreenmiller.com/2011/11/08/what-is-r-c-sprouls-position-on-creation/"], ["Associates for Biblical Research, 'R.C. Sproul Changes his Views on Genesis 1'", "https://biblearchaeology.org/rc-sproul-changes-his-views-on-genesis-1/"]]}, "15": {"c": 0, "n": "Governing/juridical authority 'is not to be held by women'; women barred from office of elder (Now That's a Good Question, p.346).", "s": [["Ligonier/Tabletalk devotional 'Female Authority' (quoting Sproul)", "https://learn.ligonier.org/devotionals/female-authority"]]}, "16": {"c": 1, "n": "Holds Calvin's view: Christ's body stays in heaven but is spiritually 'made present' to believers; real but spiritual presence.", "s": [["Sproul, Essential Truths of the Christian Faith (BibleGateway devotional)", "https://www.biblegateway.com/devotionals/essential-truths-of-the-christian-faith/2023/10/19"]]}, "0": {"c": null, "n": "Surveyed every millennial view in his Ligonier lectures without firmly endorsing one.", "s": []}}, "Kenneth Gentry": {"0": {"c": 2, "n": "Leading postmillennial author (He Shall Have Dominion): the gospel will progressively triumph before Christ's return.", "s": [["Wikipedia, Kenneth Gentry", "https://en.wikipedia.org/wiki/Kenneth_Gentry"], ["Gentry, He Shall Have Dominion (Goodreads)", "https://www.goodreads.com/book/show/2058227"]]}, "1": {"c": 2, "n": "1 Thess 4 is 'the visible, glorious, second advent to conclude history, not an invisible rapture'.", "s": [["Gentry, 'Rapture in 1 Thessalonians 4?' (PostmillennialWorldview)", "https://postmillennialworldview.com/2017/10/10/rapture-in-1-thess-4/"]]}, "2": {"c": 1, "n": "Orthodox (partial) preterist; argues Revelation written before AD 70 and largely fulfilled in Jerusalem's fall.", "s": [["Wikipedia, Kenneth Gentry", "https://en.wikipedia.org/wiki/Kenneth_Gentry"], ["Gentry, 'How to Introduce Preterism (1)'", "https://postmillennialworldview.com/2025/12/16/how-to-introduce-preterism-1/"]]}, "3": {"c": 2, "n": "\"The biblical record presents Christianity as the fruition of Israel, never to be undone\"; Jew and Gentile one people in Christ.", "s": [["Gentry, 'Dispensationalism, Israel and the Church'", "https://postmillennialworldview.com/2022/05/03/dispensationalism-israel-and-the-church/"]]}, "4": {"c": 1, "n": "70th week fulfilled in the first century: Christ's death mid-week ends sacrifice; AD 70 follows as judgment.", "s": [["Gentry, 'Postmillennialism and Daniel's 70th Week'", "https://postmillennialworldview.com/2013/11/18/postmillennialism-and-daniels-70th-week/"]]}, "5": {"c": 1, "n": "The Beast of Revelation: the beast/666 is Nero Caesar, 'one of John's contemporaries'.", "s": [["DTS Voice review of Gentry, The Beast of Revelation", "https://voice.dts.edu/review/kenneth-l-gentry-jr-the-beast-of-revelation/"], ["Wikipedia, Kenneth Gentry", "https://en.wikipedia.org/wiki/Kenneth_Gentry"]]}, "9": {"c": 0, "n": "\"Not all postmillennialists are Calvinists. But they should be!\" Affirms sovereign predestination and election.", "s": [["Gentry, 'Questioning God's Sovereignty (1)'", "https://postmillennialworldview.com/2022/03/22/gods-sovereignty-mans-questions-1/"], ["Gentry, 'God's Sovereignty; Our Hope (2)'", "https://postmillennialworldview.com/2021/09/28/gods-sovereignty-our-hope-2/"]]}, "10": {"c": 2, "n": "Cessationist: wrote The Charismatic Gift of Prophecy (reply to Grudem) and on tongues' 'cessation'.", "s": [["Wikipedia, Kenneth Gentry", " function readSurvey(form){const fd=new FormData(form);
  let P=surveyFor;if(!isAdmin)P=PEOPLE.find(p=>p.mine)||null;if(P&&!canEdit(P))return null;
  if(!P){P={name:"",user:true,on:true,v:[],also:{},conv:{}};if(!isAdmin)P.mine=true;PEOPLE.splice(1,0,P)}
  const name=String(fd.get("name")||"").trim().slice(0,60)||(isAdmin?"New person":"Me");
  P.name=P.self?name:uniqueName(name,P);P.church=String(fd.get("church")||"").slice(0,80);P.user=true;
  P.v=TOPICS.map((_,i)=>{const x=fd.get("t"+i);return {c:x===""||x==null?null:+x}});
  P.also={};P.conv={};TOPICS.forEach((_,i)=>{const a=fd.getAll("a"+i).map(Number).filter(k=>k!==P.v[i].c);if(a.length)P.also[i]=a;if(P.v[i].c!=null)P.conv[i]=+fd.get("c"+i)});
  saveUsers(P);owner=P;if(!P.self){target=PEOPLE.find(Q=>Q.self)||target;cwOther=P;P.on=true}else target=P;return P}

// phones: first tap shows the verse; the pop-up's own button opens the Bible site/app
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a.vref");
  if(a&&touch){e.preventDefault();if(vpopFor===a){hideVerse()}else showVerse(a);return}
  if(vpop&&vpop.style.display==="block"&&!e.target.closest("#vpop"))hideVerse();
  if(e.target.closest(".vpx"))hideVerse()},true);
addEventListener("scroll",()=>{if(touch&&vpopFor)placeVerse(vpopFor);else if(vpopFor)hideVerse()},{passive:true});
// ---- light / dark (charcoal) switch ----
const THEME_KEY="decisionwheel_theme",MODES=["auto","light","dark"],MODE_LABEL={auto:"◐ Auto",light:"☀ Light",dark:"☾ Dark"};
function applyTheme(){const m=document.documentElement.getAttribute("data-mode")||"auto";
  const dark=m==="dark"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme",dark?"dark":"light");
  const b=document.getElementById("theme");b.textContent=MODE_LABEL[m];b.title="Colour mode: "+m+" (tap to change)";
  const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.content=dark?"#2A2C30":"#0E7C86"}
document.getElementById("theme").onclick=()=>{const m=document.documentElement.getAttribute("data-mode")||"auto";
  const n=MODES[(MODES.indexOf(m)+1)%MODES.length];document.documentElement.setAttribute("data-mode",n);lsSet(THEME_KEY,n);applyTheme();toast("Colour mode: "+n)};
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
applyTheme();
