<style>
:root{--bg:#fff;--surface:#fff;--soft:#F1F3F5;--line:#E4E7EB;--ink:#1F2933;--muted:#52606D;--grey:#9AA3AD;--teal:#0E7C86;--tealbg:#0E7C86;--tealsoft:#E3F1F2;--tealline:#CFE3E5;--tealdark:#0E5F66;
  --amberbg:#FFF4D6;--amberfg:#7A5A00;--amberline:#E9C46A;--greenbg:#E7F6EC;--greenfg:#1E6B3A;--orangebg:#FBE3D7;--toastbg:#1F2933;color-scheme:light}
/* charcoal dark mode */
html[data-theme=dark]{--bg:#2A2C30;--surface:#33363B;--soft:#3A3D43;--line:#4A4E56;--ink:#ECEDEF;--muted:#BCC3CA;--grey:#8E969F;--teal:#5CC8D1;--tealbg:#0F7F89;--tealsoft:#21474B;--tealline:#2F6267;--tealdark:#A6E3E8;
  --amberbg:#4A3E1E;--amberfg:#F3D27A;--amberline:#8A7230;--greenbg:#1F3B2A;--greenfg:#9EDDB2;--orangebg:#5A3A2C;--toastbg:#111214;color-scheme:dark}
html,body{background:var(--bg)}
/* BookWorm: parchment library, serif. LampLight: leather and lamplight, dark, modern font */
html[data-mode=bookworm]{--bg:#F3EBD8;--surface:#FBF6EA;--soft:#E9DFC6;--line:#D6C7A1;--ink:#33281C;--muted:#6A5843;--grey:#9C8A6E;--teal:#7B2D26;--tealbg:#7B2D26;--tealsoft:#EFDCD3;--tealline:#DDBFB3;--tealdark:#5A1F1A;--orangebg:#F1D7C4;--toastbg:#33281C;color-scheme:light}
html[data-mode=bookworm] body,html[data-mode=bookworm] button,html[data-mode=bookworm] select,html[data-mode=bookworm] input,html[data-mode=bookworm] textarea{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif}
html[data-mode=bookworm] .topt,html[data-mode=bookworm] .bpill{border-color:#A9812F}
html[data-mode=bookworm] .tnum,html[data-mode=bookworm] .tnumbig{background:#2F4A3A!important}
html[data-mode=lamplight]{--bg:#251A13;--surface:#30231A;--soft:#3B2C21;--line:#5A4433;--ink:#F2E7D2;--muted:#D2BF9E;--grey:#A08B6E;--teal:#E0B15A;--tealbg:#8A5A1C;--tealsoft:#46331E;--tealline:#6E5130;--tealdark:#F3D594;--orangebg:#5B3424;--toastbg:#140E0A;color-scheme:dark}
html[data-mode=lamplight] .topt,html[data-mode=lamplight] .bpill,html[data-mode=lamplight] .tab-read .rcard,html[data-mode=lamplight] .bio-desk .rcard{border-color:#B98B3A}
html[data-mode=lamplight] .tnum,html[data-mode=lamplight] .tnumbig{background:#6E2A22!important}
html[data-mode=bookworm] #s svg rect[fill="#fff"]{fill:var(--bg)}
html[data-mode=bookworm] #s svg [fill="#1F2933"]{fill:var(--ink)}html[data-mode=bookworm] #s svg [stroke="#1F2933"]{stroke:var(--ink)}html[data-mode=bookworm] #s svg [fill="#52606D"]{fill:var(--muted)}
html[data-theme=dark][data-mode=lamplight] #s svg,html[data-theme=dark][data-mode=lamplight] .cmp svg{filter:invert(.88) hue-rotate(180deg) sepia(.55) saturate(1.25)}
html[data-theme=dark] #s svg,html[data-theme=dark] .cmp svg{filter:invert(.86) hue-rotate(180deg) saturate(1.15)}
html[data-theme=dark] .dot{filter:none}
html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{background:var(--surface);color:var(--ink);border-color:var(--line)}
html[data-theme=dark] a{color:var(--teal)}
/* colours written straight into the page by the app */
html[data-theme=dark] [style*="color:#9AA3AD"],html[data-theme=dark] [style*="color:#52606D"]{color:var(--muted)!important}
html[data-theme=dark] [style*="color:#1F2933"]{color:var(--ink)!important}
html[data-theme=dark] [style*="color:#0E7C86"]{color:var(--teal)!important}
html[data-theme=dark] [style*="background:#fff"]{background:var(--surface)!important}
html[data-theme=dark] [style*="background:#F4F5F7"]{background:var(--soft)!important}
html[data-theme=dark] [style*="background:#E3F1F2"]{background:var(--tealsoft)!important}
html[data-theme=dark] [style*="background:#E4E7EB"],html[data-theme=dark] [style*="background:#EEF2F4"],html[data-theme=dark] [style*="background:#F1F3F5"]{background:var(--line)!important}
html[data-theme=dark] [style*="background:#FBE3D7"]{background:var(--orangebg)!important}
html[data-theme=dark] [style*="border:1px solid #D9DEE3"]{border-color:var(--line)!important}

#theme{padding:9px 12px;min-width:44px}

body{margin:0;background:var(--bg);font-family:Helvetica,Arial,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px 16px 4px}
button{padding:9px 16px;font-size:15px;border:1px solid var(--teal);border-radius:6px;background:var(--bg);color:var(--teal);cursor:pointer}
button.on,button.primary{background:var(--tealbg);color:#fff}
.hint{font-size:13px;color:var(--muted);margin:2px 16px 0;text-align:center}
#s{width:100%;max-width:1150px}#s svg{width:100%;height:auto;display:block}
.topic{cursor:pointer}
#tip{position:fixed;pointer-events:none;max-width:320px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(31,41,51,.15);padding:12px 14px;font-size:13px;line-height:1.4;display:none;z-index:10}
#tip h4{margin:0 0 2px;font-size:15px}
#tip .q{color:var(--muted);margin:0 0 8px;font-style:italic}
#tip .o{margin:6px 0 0;padding-left:16px;position:relative;color:var(--muted)}
#tip .o:before{content:"";position:absolute;left:0;top:4px;width:8px;height:8px;border-radius:50%;border:2px solid var(--grey);box-sizing:border-box}
#tip .o.dec{color:var(--ink)}
#tip .o.dec:before{background:var(--tealbg);border-color:var(--teal)}
#tip .o b{color:var(--ink)}
#tip .o.dec b,#tip .o.also b{color:var(--teal)}
#tip .o.also:before{border-color:var(--teal)}
.cmp{width:100%;max-width:1060px;padding:8px 16px 32px;box-sizing:border-box}
#s>*{margin-left:auto;margin-right:auto}
.cmp h2{font-size:22px;margin:10px 0 2px}
.cmp .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.people{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;background:var(--bg)}
.chip.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.chip.off{opacity:.4}
.chip input[type=text]{border:0;font:600 14px Helvetica,Arial;width:80px;color:var(--ink);background:transparent}
.chip input[type=checkbox]{margin:0 2px 0 4px;cursor:pointer}
.dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 11px Helvetica,Arial;flex:none;box-shadow:0 0 0 2px var(--bg)}
.grid{display:grid;grid-template-columns:minmax(130px,1.1fr) repeat(3,minmax(0,1fr)) 92px;border-top:1px solid var(--line)}
.grid>div{border-bottom:1px solid var(--line);padding:8px 8px;min-height:44px;box-sizing:border-box}
.gh{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;align-self:end;border-bottom:1px solid var(--grey)!important}
.tn{font-weight:700;font-size:14px;display:flex;align-items:center}
.cell{cursor:pointer;border-radius:4px;transition:background .15s}
.cell:hover{outline:1.5px solid var(--grey);outline-offset:-3px}
.cell .on{font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px}
.cell .ds{display:flex;flex-wrap:wrap;gap:3px}
.agree{font-size:12.5px;color:var(--muted);display:flex;align-items:center}
.agree b{color:var(--ink)}
.pair{margin-top:26px}
.pair h3{font-size:16px;margin:0 0 2px}
.pair table{border-collapse:separate;border-spacing:3px;margin-top:8px}
.pair td,.pair th{width:64px;height:40px;text-align:center;font-size:13px;border-radius:4px}
.pair th{font-weight:600;color:var(--ink)}
.blank{display:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 16px}
.tabs button{padding:6px 14px;font-size:14px}
.hm{border-collapse:separate;border-spacing:3px;font-size:12.5px;width:100%}
.hm th{font-weight:600;text-align:left;padding:4px 6px;white-space:nowrap}
.hm td{border-radius:4px;padding:8px 6px;text-align:center;font-weight:600;min-width:90px}
.hm td.n{color:var(--grey);background:var(--soft);font-weight:400}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:10px 0 0}
.key span{display:inline-flex;align-items:center;gap:5px}
.key i{width:14px;height:14px;border-radius:3px;display:inline-block}
.lbl{border-collapse:collapse;width:100%;font-size:13.5px}
.lbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--grey);padding:8px}
.lbl td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}
.tag{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 9px;margin:2px 3px 2px 0;font-size:12.5px}
.src{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}
.src a{color:var(--teal)}
.selref{font:14px Helvetica,Arial;padding:4px 6px;margin-left:6px}
.pbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
button.mini{padding:5px 11px;font-size:13px}
.fams{display:flex;flex-wrap:wrap;gap:10px 22px;margin-bottom:16px}
.fh{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 5px;display:flex;align-items:center;gap:6px}
.fh i{width:10px;height:10px;border-radius:50%;display:inline-block}
.fam .people{margin:0;gap:6px}
button.chip{font:600 13.5px Helvetica,Arial;color:var(--ink);padding:3px 10px 3px 3px;border:1.5px solid var(--line)}
button.chip.off{opacity:.38}
.hm th.ch{text-align:center;font-size:12px;white-space:normal;min-width:62px}
.hm{table-layout:fixed}.hm td{min-width:0;font-size:11.5px;padding:7px 3px;overflow-wrap:anywhere;hyphens:auto}.hm th.ch{min-width:0;font-size:11.5px}.hm tr>th:first-child{width:140px}
.vm{font-size:9px;margin-left:2px;letter-spacing:-1px;opacity:.85}
.hmt{table-layout:auto;min-width:1480px}.hmt td{min-width:66px}.hmt th:first-child{width:170px;font-size:12.5px}.hmt td{font-size:11.5px;overflow-wrap:normal;hyphens:none}
.new{font:600 9.5px Helvetica,Arial;background:var(--amberbg);color:var(--amberfg);border-radius:4px;padding:1px 4px;margin-left:2px;text-transform:uppercase}
.chin{font:13.5px Helvetica,Arial;border:1px solid var(--line);border-radius:4px;padding:4px 6px;width:150px}

.tbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:0 0 12px;font-size:14px}
.qb{display:flex;gap:6px;flex-wrap:wrap}
button.lnk{border:0;background:none;color:var(--teal);font:600 11px Helvetica,Arial;padding:0 2px;margin-left:4px;cursor:pointer;text-decoration:underline;text-transform:none;letter-spacing:0}
button.chip.tgt{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.new.usr{background:var(--tealsoft);color:var(--tealdark)}
.ch3{font-size:16px;margin:18px 0 6px}
.clist{list-style:none;padding:0;margin:0}.clist li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cdet{font-size:12.5px;color:var(--muted);margin-top:3px}
.cbar{display:inline-block;width:90px;height:7px;background:var(--soft);border-radius:4px;margin-left:10px;vertical-align:middle;overflow:hidden}.cbar i{display:block;height:100%;background:var(--tealbg)}
.rl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rcard{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.rt{font-weight:700;font-size:15px;margin-bottom:4px}.rov{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.ro{font-size:13px;padding:10px 0 9px;border-top:1px dashed var(--line)}.ro div{color:var(--muted);margin-top:4px}
.rtag{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:4px}.rtag.dec{background:var(--tealbg);color:#fff}.rtag.also{background:var(--bg);color:var(--teal);border:1.5px solid var(--teal)}.rtag.con{background:var(--soft);color:var(--muted)}.rcard.flash{box-shadow:0 0 0 3px var(--teal)}.rcard{transition:box-shadow .3s}
.blinks{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:4px;vertical-align:middle}
.blink{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;text-decoration:none;white-space:nowrap}
.blink.au{background:var(--tealsoft);color:var(--tealdark)}.blink.us{background:var(--soft);color:var(--muted)}.blink.free{background:var(--greenbg);color:var(--greenfg)}
.bk{margin:6px 0 8px}
.bkt{color:var(--ink)!important;font-size:13.5px;line-height:1.35}.bkt b{font-weight:700}.bkt .bka{color:var(--muted)}
.bkm{margin-top:3px!important;display:flex;flex-wrap:wrap;gap:4px;align-items:center}.bkm .lean{margin-left:0}
.lean{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:1px;cursor:help}
.lean.bal{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.lean.arg{background:var(--bg);color:#B8962E;border:1.5px solid #C9A227}
.lean.agn{background:var(--bg);color:#B8483A;border:1.5px solid #D98B7E}
.lean.sur{background:var(--soft);color:var(--muted)}
.simgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.scard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--bg)}
.scard h3{margin:0;font-size:16px;display:flex;gap:8px;align-items:center}
.scard .sq{font-size:13px;color:var(--muted);margin:6px 0 10px}
.sopt{padding:8px 0;border-top:1px solid var(--line)}
.sopt .sn{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.sopt .sd{font-size:12.5px;color:var(--muted);margin:3px 0 6px;line-height:1.4}
.sbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.sbar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.sopt.mine .sn{color:var(--teal)}
.scnt{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}

function strc(x,n){return String(x==null?"":x).replace(/[\u0000-\u001f]/g," ").slice(0,n)}

function nameKey(n){const NAME_TITLES=/^(dr|rev|revd|reverend|prof|professor|pastor|bishop|fr|father|sir|saint|st|mr|mrs|ms|miss)\s+/;let s=String(n||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\(.*?\)/g," ")

  while(NAME_TITLES.test(s))s=s.replace(NAME_TITLES,"");
  return s.replace(/\b(jr|sr|ii|iii|iv|phd|dd)\b/g," ").replace(/\s+/g," ").trim().replace(/\b([a-z]) (?=[a-z]\b)/g,"$1")}

    ol:o&&/^OL\d+A$/.test(o.key||"")?{key:o.key,name:strc(o.name,120),birth:strc(o.birth,40),death:strc(o.death,40),top:strc(o.top,160)}:null,
    books:Array.isArray(a.books)?a.books.slice(0,10).map(b=>[strc(b[0],160),strc(b[1],8)]):[],
    alt:Array.isArray(a.alt)?a.alt.slice(0,6).map(x=>x&&x.type==="wiki"&&/^https:\/\/[a-z]+\.wikipedia\.org\//.test(x.url||"")?{type:"wiki",title:strc(x.title,120),url:strc(x.url,300)}:x&&x.type==="ol"&&/^OL\d+A$/.test(x.key||"")?{type:"ol",key:x.key,name:strc(x.name,120),top:strc(x.top,160)}:null).filter(Boolean):[],
    bsrc:Array.isArray(a.bsrc)?a.bsrc.slice(0,4).filter(x=>x&&/^https:\/\/[a-z]+\.wikipedia\.org\//.test(x.url||"")).map(x=>({title:strc(x.title,120),url:strc(x.url,300)})):[]}}
function mergeAdded(list){list.forEach(a=>{a=cleanAdded(a);if(!a)return;const i=ADDED.findIndex(x=>nameKey(x.name)===nameKey(a.name));
  if(i<0){ADDED.push(a);return}const old=ADDED[i],nw=(a.saved||0)>(old.saved||0),keep=nw?a:old,other=nw?old:a;
  // same person entered twice (e.g. "Jane Doe" and "jane doe"): newest wins, but no book, note or source is lost
  if(!keep.removed&&!other.removed&&(keep.name!==other.name||keep.book!==other.book||keep.notes!==other.notes)){const t=keep.saved;mergeInto(keep,other);keep.saved=t}
  ADDED[i]=keep})}
function saveAdded(){if(isAdmin){lsSet(ADDED_KEY,JSON.stringify(ADDED));saveUsers()}}
function yearOf(x){const m=String(x||"").match(/(\d{3,4})/);return m?+m[1]:null}
function erasFromYears(b,d){b=yearOf(b);d=yearOf(d);if(d&&d<1900)return["A"];if(b&&b<1870)return["A","H"];if(b&&b<1955)return d&&d<2005?["H"]:["H","M"];return["M"]}
function applyAdded(){fixAdded();
  for(let i=PEOPLE.length-1;i>=0;i--){const P=PEOPLE[i];if(P.added&&!ADDED.some(a=>!a.removed&&a.name===P.name))PEOPLE.splice(i,1)}
  ADDED.forEach(a=>{if(a.removed)return;let P=PEOPLE.find(p=>p.name===a.name&&!p.user);if(P&&!P.added)return; // already fully researched
    if(!P){P={name:a.name,added:true,trad:[],on:false,church:"",src:"",v:TOPICS.map(()=>({c:null})),also:{},conv:{}};PEOPLE.push(P)}
    P.src="Added by Luke"+(a.book?" after seeing "+a.book:"");const o=a.ol||{};
    const life=o.birth&&o.death?`${yearOf(o.birth)}–${yearOf(o.death)}`:o.birth?`b. ${yearOf(o.birth)}`:"";
    BIO[a.name]={life,era:"",known:[a.wiki&&a.wiki.desc,a.wiki&&a.wiki.extract].filter(Boolean).join(" — ")||(o.top?"Author of "+o.top+".":"Not looked up yet."),
      spec:[a.book&&"Seen: "+a.book,a.notes&&"Luke's note: "+a.notes].filter(Boolean).join(" · "),contro:[]};
    BOOKS[a.name]=(a.books||[]).map(([t])=>[t,[]]);
    LINKS[a.name]=[a.wiki&&["Wikipedia: "+a.wiki.title,a.wiki.url],a.ol&&["Open Library: "+a.ol.name,"https://openlibrary.org/authors/"+a.ol.key],
      ...(a.bsrc||[]).map(x=>["Wikipedia (book): "+x.title,x.url]),...(a.alt||[]).map(x=>x.type==="wiki"?["Wikipedia (possibly the same person): "+x.title,x.url]:["Open Library (possibly the same person): "+x.name+(x.top?" — "+x.top:""),"https://openlibrary.org/authors/"+x.key])].filter(Boolean);
    ERA_OF[a.name]=erasFromYears(o.birth,o.death)})}
let addBox=null,addCands=null;
function openAdd(prefill){if(!isAdmin)return;if(!addBox){addBox=document.createElement("div");addBox.id="addp";document.body.appendChild(addBox);addBox.addEventListener("click",addClick)}
  addBox.innerHTML=`<div class="mbox" role="dialog" aria-label="Add a person"><div class="vph"><h3 style="margin:0">Add a person</h3><button class="vpx" data-a="close" aria-label="Close">×</button></div>
   <p class="sub" style="margin:4px 0 10px">Look them up, confirm it's the right person from a source or book, and they're saved for research. No internet? Save now and check later.</p>
   <label class="aplab">Name<input id="ap_name" class="chin" autocomplete="off" value="${esc(prefill&&prefill.name||"")}"></label>
   <label class="aplab">Book or source you saw <span class="tmut">(optional, helps confirm)</span><input id="ap_book" class="chin" autocomplete="off" value="${esc(prefill&&prefill.book||"")}"></label>
   <label class="aplab">Notes <span class="tmut">(optional)</span><textarea id="ap_notes" class="chin" rows="2">${esc(prefill&&prefill.notes||"")}</textarea></label>
   <div class="btngrid" style="margin-top:8px"><button class="primary" data-a="find">Find &amp; confirm</button><button data-a="quick">Save without checking</button></div>
   <div id="ap_res"></div><div class="ctlh" style="margin-top:12px">Research queue</div><div id="ap_queue"></div></div>`;
  addBox.style.display="flex";renderQueue();document.getElementById("ap_name").focus()}
function renderQueue(){const q=ADDED.filter(a=>!a.removed),el=document.getElementById("ap_queue");if(!el)return;
  el.innerHTML=q.length?q.map((a,i)=>`<div class="aq"><div><b>${esc(a.name)}</b> <span class="rtag ${a.confirmed?"dec":"con"}">${a.confirmed?"Confirmed":"Not checked"}</span>${PEOPLE.some(p=>p.name===a.name&&!p.added)?' <span class="rtag also">Researched</span>':""}
     <div class="tmut" style="font-size:12px">${esc([a.book,a.notes].filter(Boolean).join(" · "))}</div></div>
     <div class="aqb">${a.confirmed?"":`<button class="mini" data-a="check" data-n="${esc(a.name)}">Check now</button>`}<button class="mini" data-a="rename" data-n="${esc(a.name)}">Rename</button><button class="mini" data-a="remove" data-n="${esc(a.name)}">Remove</button></div></div>`).join(""):'<span class="tmut">No one added yet.</span>'}
let carryWorks=[]; // book pages found while looking up a title, kept as sources for its author
async function findPerson(opt){opt=opt||{};const name=document.getElementById("ap_name").value.trim(),book=document.getElementById("ap_book").value.trim(),res=document.getElementById("ap_res");
  if(!name){toast("Type a name first");return}
  if(!opt.keepWorks)carryWorks=[];
  const pre=findExisting([name]);
  if(pre&&pre.kind==="researched"){res.innerHTML=`<div class="apnote"><b>${esc(pre.name)}</b> is already in the app, so they won't be added twice.</div>`;return}
  if(navigator.onLine===false){res.innerHTML=`<p class="err">You're offline. Use "Save without checking" and check them later.</p>`;return}
  res.innerHTML=`<p class="tmut">Searching Wikipedia and Open Library…</p>`;
  const q=encodeURIComponent(name);let wiki=[],ol=[];
  try{const j=await (await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${q}&format=json&origin=*&srlimit=4`)).json();
    wiki=(await Promise.all(j.query.search.slice(0,4).map(async x=>{try{const s=await (await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(x.title.replace(/ /g,"_")))).json();
      return s.type==="standard"?{title:s.title,desc:s.description||"",extract:s.extract||"",url:(s.content_urls&&s.content_urls.desktop.page)||("https://en.wikipedia.org/wiki/"+encodeURIComponent(x.title))}:null}catch(e){return null}}))).filter(Boolean)}catch(e){}
  let works=[];try{const j=await (await fetch(`https://openlibrary.org/search.json?q=${q}&limit=5&fields=title,author_name,author_key`)).json();
    works=(j.docs||[]).map(d=>({title:d.title||"",authors:d.author_name||[]}))}catch(e){}
  try{const j=await (await fetch(`https://openlibrary.org/search/authors.json?q=${q}&limit=5`)).json();
    ol=j.docs.map(d=>({key:String(d.key).replace("/authors/",""),name:d.name,birth:d.birth_date||"",death:d.death_date||"",top:d.top_work||"",count:d.work_count||0}))}catch(e){}
  const bk=book.toLowerCase(),nm=name.toLowerCase(),nk=nameKey(name);
  // is the name actually a book title? people are added by the author's name, never the book's
  const bookWiki=wiki.filter(isWorkWiki),wikiTitleMatch=bookWiki.find(w=>nameKey(w.title)===nk),workMatch=works.find(w=>nameKey(w.title)===nk);
  const isAuthorName=ol.some(o=>nameKey(o.name)===nk)||wiki.some(w=>!isWorkWiki(w)&&nameKey(w.title)===nk);
  const knownAuthor=researchedAuthorOf(name);
  if(!opt.notBook&&(knownAuthor||wikiTitleMatch||(workMatch&&!isAuthorName))){
    const title=(wikiTitleMatch&&wikiTitleMatch.title.replace(/ \((book|novel|series|commentary)\)$/i,""))||(workMatch&&workMatch.title)||name,seen=new Set(),auths=[];
    [knownAuthor,...(workMatch?workMatch.authors.flatMap(splitAuthors):[]),...ol.filter(o=>nameKey(o.top).includes(nk)).flatMap(o=>splitAuthors(o.name))]
      .forEach(a=>{const k=nameKey(a);if(a&&k&&!seen.has(k)){seen.add(k);auths.push(a)}});
    carryWorks=bookWiki.filter(w=>nameKey(w.title)===nk).map(w=>({title:w.title,url:w.url}));
    res.innerHTML=`<div class="apnote"><b>“${esc(title)}” looks like a book, not a person.</b> People are added by the author's name, and the book is kept as a source. Who's the author?
      ${auths.length?`<div class="btngrid">${auths.slice(0,5).map(a=>{const ex=findExisting([a]);return `<button data-a="author" data-n="${esc(a)}" data-t="${esc(title)}">${esc(a)}${ex&&ex.kind==="researched"?" · already in the app":ex?" · in your queue":""}</button>`}).join("")}</div>`:""}
      <label class="aplab" style="margin-top:8px">Author's name<input id="ap_auth" class="chin" autocomplete="off"></label>
      <div class="btngrid"><button class="primary" data-a="author" data-t="${esc(title)}">Look up this author</button><button data-a="notbook">It's a person — show results</button></div></div>`;return}
  const queued=pre&&pre.kind==="queue"?pre.entry:null;
  wiki=wiki.filter(w=>!isWorkWiki(w)); // book pages can't be confirmed as a person
  if(!wiki.length&&!ol.length&&queued){res.innerHTML=`<div class="apnote"><b>${esc(queued.name)}</b> is already in your research queue.</div>`;return}
  const wScore=w=>(w.title.toLowerCase()===nm?3:0)+(/theolog|pastor|bishop|author|scholar|preacher|minister|christian|church|bible|professor/i.test(w.desc+" "+w.extract)?2:0)+(bk&&(w.extract.toLowerCase().includes(bk))?3:0);
  const oScore=o=>(o.name.toLowerCase()===nm?2:0)+(bk&&o.top.toLowerCase().includes(bk.slice(0,18))?4:0)+Math.min(2,o.count/10);
  wiki.sort((a,b)=>wScore(b)-wScore(a));ol.sort((a,b)=>oScore(b)-oScore(a));addCands={wiki,ol,name,book};
  if(!wiki.length&&!ol.length){res.innerHTML=`<p class="err">Nothing found. Check the spelling, or "Save without checking".</p>`;return}
  res.innerHTML=`${queued?`<div class="apnote"><b>${esc(queued.name)}</b> is already in your research queue. Confirming adds any new details to that entry, not a second copy.</div>`:""}<div class="ctlh" style="margin-top:12px">Is this them? Pick the matching source(s)</div>
   ${wiki.length?`<div class="apgrp"><div class="tmut" style="font-size:12px">Wikipedia</div>${wiki.map((w,i)=>`<label class="apc"><input type="radio" name="apw" value="${i}"${i===0&&wScore(w)>=3?" checked":""}><span><b>${esc(w.title)}</b> <span class="tmut">${esc(w.desc)}</span><br><span class="apx">${esc(w.extract.slice(0,170))}${w.extract.length>170?"…":""}</span></span></label>`).join("")}<label class="apc"><input type="radio" name="apw" value=""${wScore(wiki[0])>=3?"":" checked"}><span class="tmut">None of these</span></label></div>`:""}
   ${ol.length?`<div class="apgrp"><div class="tmut" style="font-size:12px">Open Library (books)</div>${ol.map((o,i)=>`<label class="apc"><input type="radio" name="apo" value="${i}"${i===0&&oScore(o)>=2?" checked":""}><span><b>${esc(o.name)}</b> <span class="tmut">${esc([o.birth&&"b. "+o.birth,o.death&&"d. "+o.death].filter(Boolean).join(" · "))}</span><br><span class="apx">${o.top?"Best known: "+esc(o.top)+" · ":""}${o.count} works${bk&&o.top.toLowerCase().includes(bk.slice(0,18))?' · <b class="apok">matches your book ✓</b>':""}</span></span></label>`).join("")}<label class="apc"><input type="radio" name="apo" value=""${ol.length&&oScore(ol[0])>=2?"":" checked"}><span class="tmut">None of these</span></label></div>`:""}
   <p class="tmut" style="font-size:12px;margin:6px 0 0">Pick whichever you're sure of — one is enough. Other matches with the same name are kept as "possible" sources and their books are included for research.</p>
   <div class="btngrid" style="margin-top:8px"><button class="primary" data-a="confirm">Confirm &amp; save</button></div>`}
async function confirmPerson(){const c=addCands;if(!c)return;const wi=(document.querySelector('input[name="apw"]:checked')||{}).value,oi=(document.querySelector('input[name="apo"]:checked')||{}).value;
  const w=wi!==""&&wi!=null?c.wiki[+wi]:null,o=oi!==""&&oi!=null?c.ol[+oi]:null;
  if(!w&&!o){toast("Pick at least one source to confirm, or Save without checking");return}
  const name=c.name.replace(/\s+/g," ").trim(),nl=name.toLowerCase();
  // confirming one source doesn't rule out the others: keep same-name matches as "possible" sources for research
  const alt=[...c.wiki.filter(x=>x!==w&&x.title.replace(/ \(.*\)$/,"").toLowerCase()===nl).map(x=>({type:"wiki",title:x.title,url:x.url})),
             ...c.ol.filter(x=>x!==o&&x.name.toLowerCase()===nl).map(x=>({type:"ol",key:x.key,name:x.name,top:x.top}))];
  const keys=[o&&o.key,...alt.filter(x=>x.type==="ol").map(x=>x.key)].filter(Boolean);let books=[];const seen=new Set();
  for(const k of keys){try{const j=await (await fetch(`https://openlibrary.org/search.json?author_key=${k}&limit=8&fields=title,first_publish_year&sort=editions`)).json();
    j.docs.forEach(d=>{const t=d.title.toLowerCase();if(!seen.has(t)){seen.add(t);books.push([d.title,String(d.first_publish_year||"")])}})}catch(e){}}
  books=books.slice(0,10);
  savePerson({name,book:c.book,notes:document.getElementById("ap_notes").value.trim(),confirmed:true,wiki:w,ol:o,books,alt,bsrc:carryWorks})}
function clearAddForm(){document.getElementById("ap_res").innerHTML="";["ap_name","ap_book","ap_notes"].forEach(id=>document.getElementById(id).value="");carryWorks=[];renderQueue()}
function savePerson(a){a.saved=Date.now();
  const ex=findExisting([a.name,a.wiki&&a.wiki.title,a.ol&&a.ol.name],a.wiki&&a.wiki.url,a.ol&&a.ol.key);
  if(ex&&ex.kind==="researched"){toast(`${ex.name} is already in the app — not added again`);clearAddForm();return}
  if(ex&&ex.kind==="queue"){mergeInto(ex.entry,cleanAdded(a));applyAdded();saveAdded();toast(`${ex.entry.name} is already in the queue — new details added there`);clearAddForm();if(view==="compare")renderCompare();return}
  mergeAdded([a]);applyAdded();saveAdded();const P=PEOPLE.find(p=>p.name===cleanAdded(a).name);if(P)P.on=true;
  toast(a.confirmed?`Saved ${a.name} — added to the research queue`:`Saved ${a.name} — check them when you're online`);
  document.getElementById("ap_res").innerHTML="";["ap_name","ap_book","ap_notes"].forEach(id=>document.getElementById(id).value="");renderQueue();if(view==="compare")renderCompare()}
function addClick(e){const b=e.target.closest("[data-a]");if(e.target===addBox){addBox.style.display="none";return}if(!b)return;const a=b.dataset.a;
  if(a==="close"){addBox.style.display="none";if(view==="compare")renderCompare()}
  if(a==="find")findPerson();
  if(a==="author"){const n=(b.dataset.n||(document.getElementById("ap_auth")||{}).value||"").replace(/\s+/g," ").trim();if(!n){toast("Type the author's name");return}
    document.getElementById("ap_name").value=n;const bf=document.getElementById("ap_book");if(b.dataset.t)bf.value=b.dataset.t;findPerson({keepWorks:true})}
  if(a==="notbook")findPerson({notBook:true});
  if(a==="confirm")confirmPerson();
  if(a==="quick"){const name=document.getElementById("ap_name").value.trim();if(!name){toast("Type a name first");return}
    savePerson({name,book:document.getElementById("ap_book").value.trim(),notes:document.getElementById("ap_notes").value.trim(),confirmed:false})}
  if(a==="check"){const x=ADDED.find(y=>y.name===b.dataset.n);openAdd(x);findPerson()}
  if(a==="rename"){const row=b.closest(".aq");row.innerHTML=`<input class="chin" id="ap_rn" value="${esc(b.dataset.n)}" style="flex:1;width:auto!important"><div class="aqb"><button class="mini primary" data-a="rnsave" data-n="${esc(b.dataset.n)}">Save name</button></div>`;document.getElementById("ap_rn").focus();return}
  if(a==="rnsave"){const nn=document.getElementById("ap_rn").value.replace(/\s+/g," ").trim(),x=ADDED.find(y=>y.name===b.dataset.n);if(!nn||!x)return;
    if(nn!==x.name){const ex=findExisting([nn],null,null,x);x.removed=true;x.saved=Date.now();
      if(ex&&ex.kind==="researched")toast(`${ex.name} is already in the app — entry removed from the queue`);
      else if(ex)toast(`${ex.entry.name} is already in the queue — merged`),mergeInto(ex.entry,Object.assign({},x,{removed:false}));
      else{mergeAdded([Object.assign({},x,{name:nn,removed:false,saved:Date.now()})]);toast("Renamed to "+nn)}
      applyAdded();saveAdded()}renderQueue();if(view==="compare")renderCompare();return}
  if(a==="remove"){const x=ADDED.find(y=>y.name===b.dataset.n);if(x){x.removed=true;x.saved=Date.now();applyAdded();saveAdded();renderQueue()}}}
// ---- light / dark (charcoal) switch ----
const THEME_KEY="decisionwheel_theme",MODES=["auto","light","dark","bookworm","lamplight"],MODE_LABEL={auto:"◐ Auto",light:"☀ Light",dark:"☾ Dark",bookworm:"📖 BookWorm",lamplight:"🕯 LampLight"};
function applyTheme(){let m=document.documentElement.getAttribute("data-mode")||"auto";if(!MODE_LABEL[m]){m="auto";document.documentElement.setAttribute("data-mode",m)}
  const dark=m==="dark"||m==="lamplight"||(m==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme",dark?"dark":"light");
  const b=document.getElementById("theme");b.textContent=MODE_LABEL[m];b.title="Colour mode: "+m+" (tap to change)";
  const mt=document.querySelector('meta[name="theme-color"]');if(mt)mt.content=m==="bookworm"?"#7B2D26":m==="lamplight"?"#251A13":dark?"#2A2C30":"#0E7C86"}
document.getElementById("theme").onclick=()=>{const m=document.documentElement.getAttribute("data-mode")||"auto";
  const n=MODES[(MODES.indexOf(m)+1)%MODES.length];document.documentElement.setAttribute("data-mode",n);lsSet(THEME_KEY,n);applyTheme();toast("Colour mode: "+MODE_LABEL[n].replace(/^\S+ /,""))};
